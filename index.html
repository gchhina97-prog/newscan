<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Pre-Pump List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--line:#e7e9ee;--tx:#14171c;--mu:#7a8392;--gr:#119a57;--rd:#e0404d;--yl:#f5a524}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px "Outfit",system-ui,-apple-system,sans-serif;padding:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-size:12px}
.bar label{display:flex;flex-direction:column;font-size:10px;color:var(--mu);gap:2px}
select,input{background:#fff;color:var(--tx);border:1px solid #d9dce3;border-radius:6px;padding:5px;width:80px;font-family:inherit}
input#q{width:110px}
button{background:#14171c;color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit}
.wrap{overflow-x:auto;border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:900px;background:#fff;border:1px solid var(--line)}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mu);font-size:10px;font-weight:600;cursor:pointer;background:#fff;position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
a{color:var(--tx);text-decoration:none;font-weight:600}
.g{color:var(--gr)}.r{color:var(--rd)}.mu{color:var(--mu)}.yl{color:var(--yl)}
.v{font-weight:700}
.v.h{background:#e2f6ea;color:#0d7a44;border-radius:4px;padding:2px 6px}
.v.w{color:var(--yl)}
.v.n{color:var(--mu);font-weight:400}
.rise{color:var(--gr);font-weight:700;font-size:10px;margin-left:3px}
.pump-star{color:var(--yl);font-size:14px;margin-left:5px}
.empty{text-align:center;color:var(--mu);padding:24px}
</style>
</head>
<body>

<div class="bar">
  <label>Search<input id="q" placeholder="BTC"></label>
  <label>Min 24h vol ($M)<input id="md" type="number" value="2" min="0" step="0.5"></label>
  <label>15m ×normal<input id="x15" type="number" value="2" min="1" step="0.1"></label>
  <label>4h ×normal<input id="x4" type="number" value="1.5" min="1" step="0.1"></label>
  <label>24h ×normal<input id="x24" type="number" value="1.3" min="1" step="0.1"></label>
  <label>Max 1h px %<input id="mm" type="number" value="3" min="0" step="0.5"></label>
  <label>Max 15m px %<input id="m15" type="number" value="1.5" min="0.1" step="0.1"></label>
  <label>Max 24h px %<input id="m24" type="number" value="8" min="1" step="1"></label>
  <label>OI 1h % min<input id="mo" type="number" value="1" min="0" step="0.5"></label>
  <label>OI Z min<input id="mz" type="number" value="1.5" min="0" step="0.5"></label>
  <button id="rf">Refresh</button>
</div>

<div class="wrap"><table>
<thead><tr>
<th data-sk="base">Coin</th>
<th data-sk="price">Price</th>
<th data-sk="p24">24h %</th>
<th data-sk="v15">15m vol</th>
<th data-sk="v4">4h vol</th>
<th data-sk="v24">24h vol</th>
<th data-sk="dv7">7d vol</th>
<th data-sk="dv30">30d vol</th>
<th data-sk="oiPct">OI 1h %</th>
<th data-sk="oiZ">OI Z</th>
<th data-sk="mcap">Mkt cap</th>
</tr></thead>
<tbody id="tb"></tbody>
</table></div>

<script>
const HLA="https://api.hyperliquid.xyz/info",BF="https://fapi.binance.com/fapi/v1",BYA="https://api.bybit.com/v5/market",OKA="https://www.okx.com/api/v5";
const BFD="https://fapi.binance.com/futures/data";
const CG="https://api.coingecko.com/api/v3";
const $=id=>document.getElementById(id);
const coins=new Map(),hold={},busy={};
let sk="v15",sd=-1,lastR=0;
const MCAP=new Map();let mcapAt=0;

const FILTERS=["q","md","x15","x4","x24","mm","m15","m24","mo","mz"];
try{const s=JSON.parse(localStorage.getItem("filters")||"{}");for(const k of FILTERS)if(s[k]!=null&&$(k))$(k).value=s[k]}catch(e){}
function saveFilters(){const s={};for(const k of FILTERS)if($(k))s[k]=$(k).value;try{localStorage.setItem("filters",JSON.stringify(s))}catch(e){}}

async function get(url,opt){
  const r=await fetch(url,opt);
  if(r.status===429||r.status===418)throw new Error("429");
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}
const hlPost=b=>get(HLA,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});

function norm(s){s=s.replace(/USDT$/,"");let m=1;const r=s.match(/^(1000000|10000|1000)(.+)$/);if(r){m=+r[1];s=r[2]}return [s,m]}
function hlNorm(n){const r=n.match(/^k([A-Z0-9]{2,})$/);return r?[r[1],1000]:[n,1]}
const BL=new Set("XAU XAG XPT XPD WTI BRENT TSLA AAPL NVDA MSFT AMZN GOOGL GOOG NFLX MSTR HOOD CRCL PLTR SNDK SPY QQQ IWM".split(" "));
const meta={bn:null,by:null,ok:null};
const TFRE=/TRADFI|TRADIFI|EQUIT|STOCK|COMMODIT|FOREX|\bETF\b/i;
const tfBn=(sym,b)=>{const s=meta.bn&&meta.bn.get(sym);return BL.has(b)||!!(s&&TFRE.test([s.contractType,s.underlyingType,JSON.stringify(s.underlyingSubType||"")].join(" ")))};
const tfBy=(sym,b)=>{const s=meta.by&&meta.by.get(sym);return BL.has(b)||!!(s&&TFRE.test([s.symbolType,s.contractType].join(" ")))};
const tfOk=(id,b)=>{const s=meta.ok&&meta.ok.get(id);return BL.has(b)||!!(s&&["3","4","5","6"].includes(String(s.instCategory)))};

async function loadInfo(){
  await Promise.all([
    meta.bn||get(BF+"/exchangeInfo").then(d=>{meta.bn=new Map(d.symbols.map(x=>[x.symbol,x]))}).catch(()=>{}),
    meta.by||get(BYA+"/instruments-info?category=linear&limit=1000").then(d=>{meta.by=new Map(d.result.list.map(x=>[x.symbol,x]))}).catch(()=>{}),
    meta.ok||get(OKA+"/public/instruments?instType=SWAP").then(d=>{meta.ok=new Map(d.data.map(x=>[x.instId,x]))}).catch(()=>{})
  ]);
}
function up(b,tf){const k=b+(tf?"~":"");let o=coins.get(k);if(!o){o={base:b,key:k,tf:!!tf,ex:{},at:0};coins.set(k,o)}return o}

async function loadMcap(){
  if(Date.now()-mcapAt<300000)return;
  try{
    const d=await get(CG+"/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=1&sparkline=false");
    MCAP.clear();
    d.forEach(x=>MCAP.set((x.symbol||"").toUpperCase(),x.market_cap));
    mcapAt=Date.now();
  }catch(e){}
}

const loaders={
  async hl(){
    const [m,c]=await hlPost({type:"metaAndAssetCtxs"});let n=0;
    m.universe.forEach((u,i)=>{
      if(u.isDelisted||!c[i])return;
      const [b,mu]=hlNorm(u.name),x=c[i],px=+x.markPx,o=up(b,u.name.includes(":")||BL.has(b));
      o.hlName=u.name;
      o.ex.hl={price:px/mu,dv:+x.dayNtlVlm,p24:+x.prevDayPx?(px/+x.prevDayPx-1)*100:null,oi:+x.openInterest*px};n++;
    });return n;
  },
  async bn(){
    const t=await get(BF+"/ticker/24hr");let n=0;
    t.forEach(x=>{
      if(!x.symbol.endsWith("USDT")||x.symbol.includes("_"))return;
      const [b,m]=norm(x.symbol),o=up(b,tfBn(x.symbol,b));o.bnSym=x.symbol;
      o.ex.bn={price:+x.lastPrice/m,dv:+x.quoteVolume,p24:+x.priceChangePercent};n++;
    });return n;
  },
  async by(){
    const d=await get(BYA+"/tickers?category=linear");let n=0;
    d.result.list.forEach(x=>{
      if(!x.symbol.endsWith("USDT")||x.symbol.includes("-"))return;
      const [b,m]=norm(x.symbol),o=up(b,tfBy(x.symbol,b));o.bySym=x.symbol;
      o.ex.by={price:+x.lastPrice/m,dv:+x.turnover24h,p24:+x.price24hPcnt*100,oi:+x.openInterestValue};n++;
    });return n;
  },
  async ok(){
    const [t,oi]=await Promise.all([get(OKA+"/market/tickers?instType=SWAP"),get(OKA+"/public/open-interest?instType=SWAP")]);
    const om={};oi.data.forEach(x=>om[x.instId]=+x.oiUsd||0);let n=0;
    t.data.forEach(x=>{
      if(!x.instId.endsWith("-USDT-SWAP"))return;
      const [b,m]=norm(x.instId.split("-")[0]+"USDT"),o=up(b,tfOk(x.instId,b)),last=+x.last;
      o.ex.ok={price:last/m,dv:+x.volCcy24h*last,p24:+x.open24h?(last/+x.open24h-1)*100:null,oi:om[x.instId]};n++;
    });return n;
  }
};

async function loadAll(){
  const n0=[meta.bn,meta.by,meta.ok].filter(Boolean).length;
  await Promise.all([loadInfo(),loadMcap()]);
  if([meta.bn,meta.by,meta.ok].filter(Boolean).length>n0&&coins.size)coins.clear();
  await Promise.all(Object.keys(loaders).map(k=>loaders[k]().catch(()=>{})));
}

function agg(o){
  const e=Object.entries(o.ex).map(x=>x[1]);
  o.dv=e.reduce((a,x)=>a+(x.dv||0),0);
  const oi=e.filter(x=>x.oi!=null);o.oi=oi.length?oi.reduce((a,x)=>a+x.oi,0):null;
  const pick=k=>{for(const s of ["bn","by","hl","ok"])if(o.ex[s]&&o.ex[s][k]!=null)return o.ex[s][k];return null};
  o.price=pick("price");o.p24=pick("p24");
  o.src=o.bnSym?"bn":o.bySym?"by":o.hlName?"hl":null;
  o.mcap=MCAP.get(o.base)||null;
}

// Reset = 19:00 America/Winnipeg
function winnipegOffsetHours(){
  const now=new Date();const y=now.getUTCFullYear();
  const mar=new Date(Date.UTC(y,2,1));const marSun=mar.getUTCDay();
  const marSecondSun=marSun===0?8:15-marSun;
  const nov=new Date(Date.UTC(y,10,1));const novSun=nov.getUTCDay();
  const novFirstSun=novSun===0?1:8-novSun;
  const dstStart=Date.UTC(y,2,marSecondSun,7,0,0);
  const dstEnd=Date.UTC(y,10,novFirstSun,6,0,0);
  const t=now.getTime();
  return (t>=dstStart&&t<dstEnd)?-5:-6;
}
function lastResetMs(){
  const off=winnipegOffsetHours();
  const now=Date.now();const dayMs=86400000;
  const utcOffsetMs=off*3600000;
  const localMs=now+utcOffsetMs;
  const localDay=Math.floor(localMs/dayMs);
  let resetLocalMs=localDay*dayMs+19*3600000;
  if(resetLocalMs>localMs)resetLocalMs-=dayMs;
  return resetLocalMs-utcOffsetMs;
}

async function fetchCandles(src,o){
  if(src==="bn"){
    const [a,b]=await Promise.all([
      get(`${BF}/klines?symbol=${o.bnSym}&interval=15m&limit=1000`),
      get(`${BF}/klines?symbol=${o.bnSym}&interval=15m&endTime=${Date.now()-1000*15*60*1000}&limit=1000`).catch(()=>[])
    ]);
    const rows=[...b,...a];const seen=new Set();
    return rows.filter(x=>{const t=x[0];if(seen.has(t))return false;seen.add(t);return true}).map(x=>({t:+x[0],q:+x[7]}));
  }
  if(src==="by"){
    const r=await get(`${BYA}/kline?category=linear&symbol=${o.bySym}&interval=15&limit=1000`);
    return r.result.list.slice().reverse().map(x=>({t:+x[0],q:+x[6]}));
  }
  if(src==="hl"){
    const t=Date.now();
    const r=await hlPost({type:"candleSnapshot",req:{coin:o.hlName,interval:"15m",startTime:t-5*24*3600e3,endTime:t}});
    return r.map(x=>({t:+x.t,q:+x.v*+x.c}));
  }
  return [];
}

function computeVolume(o,candles){
  if(!candles||candles.length<20)return;
  const r=lastResetMs(),tNow=Date.now(),dayMs=86400000;
  const sum=(from,to)=>{let s=0;for(const c of candles)if(c.t>=from&&c.t<to)s+=c.q;return s};
  const w15=tNow-15*60*1000,w4=tNow-4*3600*1000,w24=tNow-24*3600*1000;
  o.qv15=sum(w15,tNow);o.qv4=sum(w4,tNow);o.qv24=sum(w24,tNow);
  o.qv7=sum(tNow-7*dayMs,tNow);o.qv30=sum(tNow-30*dayMs,tNow);
  o.dv7=o.qv7;o.dv30=o.qv30;
  const b15=sum(r,r+15*60*1000),b4=sum(r,r+4*3600*1000),b24=sum(r,r+24*3600*1000);
  o.r15=b15>0?o.qv15/b15:null;
  o.r4 =b4 >0?o.qv4 /b4 :null;
  o.r24=b24>0?o.qv24/b24:null;
  o.v15=o.r15!=null?(o.r15-1)*100:null;
  o.v4 =o.r4 !=null?(o.r4 -1)*100:null;
  o.v24=o.r24!=null?(o.r24-1)*100:null;
  let st=0;
  for(let i=candles.length-1;i>=1&&st<30;i--){if(candles[i].q>candles[i-1].q)st++;else break}
  o.vs=st;
}

const ofn={
  bn:async o=>(await get(`${BFD}/openInterestHist?symbol=${o.bnSym}&period=15m&limit=5`)).map(x=>+x.sumOpenInterestValue),
  by:async o=>(await get(`${BYA}/open-interest?category=linear&symbol=${o.bySym}&intervalTime=15min&limit=5`)).result.list.slice().reverse().map(x=>+x.openInterest)
};
function setOi(o,a){
  if(a.length<5||!a[0])return;
  let st=0;for(let i=a.length-1;i>=1;i--){if(a[i]>a[i-1])st++;else break}
  o.os=st;o.oiPct=(a[a.length-1]/a[0]-1)*100;
  const ch=[];for(let i=1;i<a.length;i++)ch.push(a[i]-a[i-1]);
  if(ch.length>=3){
    const mu=ch.reduce((s,x)=>s+x,0)/ch.length;
    const sg=Math.sqrt(ch.reduce((s,x)=>s+(x-mu)**2,0)/ch.length);
    o.oiZ=sg>0?(ch[ch.length-1]-mu)/sg:0;
  }
}
async function tickOi(){
  if(busy.oi||Date.now()<(hold.oi||0))return;
  const now=Date.now(),md=(+$("md").value||0)*1e6;let best=null,bs=-1;
  for(const o of coins.values()){
    if(o.tf||!(o.src==="bn"||o.src==="by")||o.dv<md)continue;
    const age=now-(o.oat||0);if(o.oat&&age<90000)continue;
    const sc=o.oat?age:1e12+o.dv;if(sc>bs){bs=sc;best=o}
  }
  if(!best)return;
  busy.oi=true;
  try{setOi(best,await ofn[best.src](best));best.oat=Date.now()}
  catch(e){if(String(e.message)==="429")hold.oi=Date.now()+30000;else best.oat=Date.now()}
  busy.oi=false;
}

async function tickHist(src){
  const k="h"+src;
  if(busy[k]||Date.now()<(hold[k]||0))return;
  const md=(+$("md").value||0)*1e6,now=Date.now();let best=null,bs=-1;
  for(const o of coins.values()){
    if(o.src!==src||o.dv<md||o.tf)continue;
    const age=now-(o.ha||0);if(o.ha&&age<1800000)continue;
    const sc=o.ha?age:1e12+o.dv;if(sc>bs){bs=sc;best=o}
  }
  if(!best)return;
  busy[k]=true;
  try{computeVolume(best,await fetchCandles(src,best));best.ha=Date.now()}
  catch(e){if(String(e.message)==="429")hold[k]=Date.now()+60000;else best.ha=Date.now()}
  busy[k]=false;
}

const fm=v=>v==null||isNaN(v)?"-":v>=1e12?(v/1e12).toFixed(2)+"T":v>=1e9?(v/1e9).toFixed(2)+"B":v>=1e6?(v/1e6).toFixed(1)+"M":v>=1e3?(v/1e3).toFixed(0)+"K":v.toFixed(0);
const fp=p=>p==null||isNaN(p)?"-":p>=100?p.toFixed(2):p>=1?p.toFixed(3):p>=0.01?p.toFixed(5):p.toPrecision(3);
function link(o){
  if(o.bnSym)return "https://www.tradingview.com/chart/?symbol=BINANCE:"+o.bnSym+".P";
  if(o.bySym)return "https://www.tradingview.com/chart/?symbol=BYBIT:"+o.bySym+".P";
  return "https://app.hyperliquid.xyz/trade/"+(o.hlName||o.base);
}
function vc(pct,rise){
  if(pct==null)return '<span class="mu">...</span>';
  const cls=pct>=100?"h":pct>=30?"w":"n";
  const rt=(rise!=null&&rise>=3)?`<span class="rise">(+${rise})</span>`:"";
  return `<span class="v ${cls}">${pct>=0?"+":""}${Math.round(pct)}%</span>${rt}`;
}

function render(){
  lastR=Date.now();
  const q=$("q").value.trim().toUpperCase(),md=(+$("md").value||0)*1e6;
  const x15=+$("x15").value||2,x4=+$("x4").value||1.5,x24=+$("x24").value||1.3;
  const mm=+$("mm").value||3,m15v=+$("m15").value||1.5,m24v=+$("m24").value||8;
  const mo=+$("mo").value||1,mzv=+$("mz").value||1.5;

  const all=[...coins.values()].filter(o=>!o.tf);
  all.forEach(o=>{
    agg(o);
    o.pre=
      o.r15!=null&&o.r15>=x15 &&
      o.r4 !=null&&o.r4 >=x4  &&
      o.r24!=null&&o.r24>=x24 &&
      (o.p15==null||(o.p15<=m15v&&o.p15>=-1)) &&
      (o.p1 ==null||(o.p1 <=mm &&o.p1 >=-1.5)) &&
      (o.p24==null||o.p24<=m24v) &&
      (o.oiPct==null||o.oiPct>=mo) &&
      (o.oiZ ==null||o.oiZ >=mzv);
    o.pumping=(o.vs!=null&&o.vs>=3)||(o.r15!=null&&o.r4!=null&&o.r15>=2&&o.r4>=1.5);
  });

  let arr=all.filter(o=>o.dv>=md&&o.pre&&(!q||o.base.includes(q)));
  arr.sort((a,b)=>{
    const x=a[sk],y=b[sk];
    if(sk==="base")return sd*(x<y?-1:1);
    const d=(x??-1e12)-(y??-1e12);
    return d?sd*d:(b.dv-a.dv);
  });

  $("tb").innerHTML=arr.map(o=>{
    const star=o.pumping?'<span class="pump-star">&#9733;</span>':'';
    return `<tr>
<td><a href="#" data-c="${o.key}">${o.base}</a>${star}</td>
<td>${fp(o.price)}</td>
<td class="${o.p24>=0?"g":"r"}">${o.p24==null?"-":o.p24.toFixed(2)+"%"}</td>
<td>${vc(o.v15,o.vs)}</td>
<td>${vc(o.v4,null)}</td>
<td>${vc(o.v24,null)}</td>
<td>$${fm(o.dv7)}</td>
<td>$${fm(o.dv30)}</td>
<td class="${o.oiPct>=1?"g":"mu"}">${o.oiPct==null?"...":(o.oiPct>=0?"+":"")+o.oiPct.toFixed(2)+"%"}${o.os!=null?" ("+o.os+"\u2191)":""}</td>
<td class="${o.oiZ>=2?"g":o.oiZ>=1?"yl":"mu"}">${o.oiZ==null?"...":o.oiZ.toFixed(1)}</td>
<td>${o.mcap?"$"+fm(o.mcap):'<span class="mu">-</span>'}</td>
</tr>`;
  }).join("")||'<tr><td colspan="11" class="empty">Nothing yet. Loading over the next few minutes.</td></tr>';
}

document.querySelectorAll("th[data-sk]").forEach(th=>th.onclick=()=>{
  const k=th.dataset.sk;sd=k===sk?-sd:(k==="base"?1:-1);sk=k;render();
});
document.body.onclick=e=>{
  const d=e.target.dataset||{};
  if(d.c&&coins.get(d.c)){e.preventDefault();window.open(link(coins.get(d.c)),"_blank","noopener")}
};
FILTERS.forEach(id=>{if($(id)){$(id).oninput=()=>{saveFilters();render()};$(id).onchange=saveFilters}});
let qT=null;
$("q").oninput=()=>{saveFilters();clearTimeout(qT);qT=setTimeout(render,180)};
$("rf").onclick=()=>loadAll().then(render);

(async()=>{
  await loadAll();
  render();
  setInterval(()=>tickHist("bn"),400);
  setInterval(()=>tickHist("by"),400);
  setInterval(()=>tickHist("hl"),1500);
  setInterval(tickOi,600);
  setInterval(loadMcap,300000);
  setInterval(()=>{if(Date.now()-lastR<1900)return;render()},1000);
})();
</script>
</body>
</html>
